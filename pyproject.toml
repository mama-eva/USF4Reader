[tool.ruff]
target-version = "py313"
line-length = 110
include = ["addon/**/*.py", "tools/*.py", "tests/*.py", "buildVars.py"]
exclude = ["research", ".venv", "site_scons", "public-source"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone development commands add the source path before importing the package.
"tools/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"
